name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.Github2 || secrets.EXPO_TOKEN }}

      - name: Debug Secret Presence
        run: |
          if [ -z "$MY_TOKEN" ]; then
            echo "EXPO_TOKEN/Github2 secret is EMPTY or NOT FOUND in this environment!"
          else
            echo "EXPO_TOKEN/Github2 secret is present! Length is ${#MY_TOKEN} characters."
          fi
        env:
          MY_TOKEN: ${{ secrets.Github2 || secrets.EXPO_TOKEN }}

      - name: Verify Expo login
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.Github2 || secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --local --platform android --profile production --non-interactive --output ./build/app-release.apk
        env:
          EXPO_TOKEN: ${{ secrets.Github2 || secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: last-dance-apk
          path: ./build/app-release.apk
          retention-days: 7
